name: Deploy production

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Debug secrets (TEMPORARY - remove after debugging)
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "Host length: ${#SERVER_HOST}"
          echo "Port length: ${#SERVER_PORT}"
          echo "User length: ${#SERVER_USER}"
          echo "Testing raw TCP connection to host:port..."
          timeout 10 bash -c "echo > /dev/tcp/$SERVER_HOST/${SERVER_PORT:-22}" && echo "TCP CONNECTION SUCCEEDED" || echo "TCP CONNECTION FAILED"

      - name: Deploy selected commit
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_APP_PATH: ${{ secrets.SERVER_APP_PATH }}
        run: |
          PORT="${SERVER_PORT:-22}"
          ssh -p "$PORT" "$SERVER_USER@$SERVER_HOST" \
            "cd '$SERVER_APP_PATH' && bash scripts/deploy.sh '${{ github.sha }}'"